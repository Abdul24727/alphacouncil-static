<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AlphaCouncil</title>
  <meta name="description" content="Sign in to your AlphaCouncil account for AI-powered GCC portfolio intelligence.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #07111F;
      --bg-base: #0B1120;
      --bg-elevated: #101624;
      --surface: #111A2B;
      --surface-elevated: #141D2F;
      --surface-glass: rgba(17, 26, 43, 0.95);
      --fg: #F8FAFC;
      --fg-muted: #AAB6C5;
      --fg-dim: #6B7A8F;
      --accent-primary: #27D3C3;
      --accent-primary-glow: rgba(39, 211, 195, 0.2);
      --accent-gold: #D7B76A;
      --accent-gold-glow: rgba(215, 183, 106, 0.15);
      --accent-violet: #8B5CF6;
      --accent-violet-glow: rgba(139, 92, 246, 0.15);
      --success: #10B981;
      --success-glow: rgba(16, 185, 129, 0.15);
      --danger: #EF4444;
      --danger-glow: rgba(239, 68, 68, 0.15);
      --warning: #F59E0B;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.12);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body { font-family: var(--font-sans); background: var(--bg-deep); color: var(--fg); line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

    .atmosphere { position: fixed; inset: 0; pointer-events: none; z-index: -1; }
    .atmosphere::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(39, 211, 195, 0.04) 0%, transparent 50%), radial-gradient(ellipse 60% 40% at 80% 80%, rgba(139, 92, 246, 0.03) 0%, transparent 50%); }

    /* Header */
    .auth-header { position: fixed; top: 0; left: 0; right: 0; height: 64px; background: rgba(11, 17, 32, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; }
    .header-logo { font-size: 18px; font-weight: 700; color: var(--fg); text-decoration: none; display: flex; align-items: center; gap: 10px; }
    .header-logo img { height: 28px; width: auto; }
    .header-logo:hover { color: var(--accent-primary); }
    .header-right { display: flex; align-items: center; gap: 16px; font-size: 14px; color: var(--fg-muted); }
    .header-right a { color: var(--accent-primary); text-decoration: none; font-weight: 500; }
    .header-right a:hover { text-decoration: underline; }

    /* Main */
    .auth-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 96px 24px 48px; }

    .auth-card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 40px; position: relative; overflow: hidden; }
    .auth-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent-primary), transparent); }

    .auth-title { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; text-align: center; }
    .auth-subtitle { font-size: 14px; color: var(--fg-muted); text-align: center; margin-bottom: 32px; }

    /* Form */
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--fg-muted); margin-bottom: 8px; }
    .form-input { width: 100%; padding: 14px 16px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; font-size: 15px; color: var(--fg); font-family: inherit; transition: all 0.2s; }
    .form-input:focus { outline: none; border-color: var(--accent-primary); box-shadow: 0 0 0 3px var(--accent-primary-glow); }
    .form-input::placeholder { color: var(--fg-dim); }

    .form-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .checkbox-label { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--fg-muted); cursor: pointer; }
    .checkbox-label input { display: none; }
    .checkbox-box { width: 18px; height: 18px; border: 1px solid var(--border); border-radius: 4px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .checkbox-label input:checked + .checkbox-box { background: var(--accent-primary); border-color: var(--accent-primary); }
    .checkbox-box svg { width: 12px; height: 12px; color: var(--bg-deep); opacity: 0; transition: opacity 0.2s; }
    .checkbox-label input:checked + .checkbox-box svg { opacity: 1; }
    .form-link { font-size: 13px; color: var(--accent-primary); text-decoration: none; }
    .form-link:hover { text-decoration: underline; }

    .btn-primary { width: 100%; padding: 14px 24px; background: linear-gradient(135deg, var(--accent-primary), #1FA89A); border: none; border-radius: 10px; font-size: 15px; font-weight: 600; color: var(--bg-deep); cursor: pointer; transition: all 0.3s var(--ease-out); display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--accent-primary-glow); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-primary .spinner { width: 18px; height: 18px; border: 2px solid transparent; border-top-color: var(--bg-deep); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Divider */
    .auth-divider { display: flex; align-items: center; gap: 16px; margin: 28px 0; }
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .auth-divider span { font-size: 12px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.05em; }

    /* Social */
    .social-buttons { display: flex; flex-direction: column; gap: 12px; }
    .btn-social { flex: 1; padding: 12px 16px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-weight: 500; color: var(--fg); cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: inherit; }
    .btn-social:hover { border-color: var(--border-strong); background: var(--surface-elevated); }
    .btn-social svg { width: 20px; height: 20px; }
    /* "Coming soon" badge — Apple button only. Subtle gold-tinted pill (matches signup.html). */
    .soon-badge { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.4; white-space: nowrap; color: var(--accent-gold); background: rgba(215, 183, 106, 0.12); border: 1px solid rgba(215, 183, 106, 0.28); padding: 2px 7px; border-radius: 100px; }

    /* Auth step transitions */
    .auth-step { display: none; animation: fadeIn 0.3s ease; }
    .auth-step.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .back-btn { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg-dim); background: none; border: none; cursor: pointer; margin-bottom: 20px; transition: color 0.2s; }
    .back-btn:hover { color: var(--accent-primary); }
    .back-btn svg { width: 16px; height: 16px; }

    /* Footer */
    .auth-footer { padding: 24px; text-align: center; font-size: 12px; color: var(--fg-dim); }
    .auth-footer a { color: var(--fg-muted); text-decoration: none; margin: 0 12px; }
    .auth-footer a:hover { color: var(--accent-primary); }

    /* Toast */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--surface-glass); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 12px; padding: 14px 20px; display: flex; align-items: center; gap: 12px; z-index: 1000; opacity: 0; transition: all 0.3s var(--ease-out); }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .toast-icon.success { background: var(--success-glow); color: var(--success); }
    .toast-icon.error { background: var(--danger-glow); color: var(--danger); }
    .toast-icon.info { background: var(--accent-primary-glow); color: var(--accent-primary); }
    .toast-icon svg { width: 18px; height: 18px; }
    .toast-content { font-size: 14px; }
    .toast-title { font-weight: 600; margin-bottom: 2px; }
    .toast-text { color: var(--fg-muted); font-size: 13px; }

    @media (max-width: 480px) {
      .auth-card { padding: 32px 24px; margin: 0 16px; }
      .social-buttons { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="atmosphere"></div>

  <header class="auth-header">
    <a href="index.html" class="header-logo">
      <span style="font-weight: 700; letter-spacing: -0.02em;">AlphaCouncil</span>
    </a>
    <div class="header-right">
      <div class="lang-toggle" style="display:inline-flex;align-items:center;gap:2px;padding:2px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:100px;margin-right:6px;">
        <button data-lang="en" class="active" style="font:inherit;font-size:12px;font-weight:600;line-height:1;padding:5px 10px;border:none;border-radius:100px;cursor:pointer;background:transparent;color:var(--fg-muted);">EN</button>
        <button data-lang="ar" style="font:inherit;font-size:12px;font-weight:600;line-height:1;padding:5px 10px;border:none;border-radius:100px;cursor:pointer;background:transparent;color:var(--fg-muted);">AR</button>
      </div>
      <span data-i18n="lg.header_prompt">Don't have an account?</span> <a href="signup.html" data-i18n="lg.header_signup">Sign up</a>
    </div>
  </header>
  <style>
    .lang-toggle button.active { background: var(--accent-primary) !important; color: var(--bg-deep) !important; }
  </style>

  <main class="auth-main">
    <div class="auth-card">
      <!-- Step 1: Credentials -->
      <div class="auth-step active" id="step-credentials">
        <h1 class="auth-title" data-i18n="lg.title">Welcome back</h1>
        <p class="auth-subtitle" data-i18n="lg.subtitle">Sign in to access your portfolio intelligence</p>

        <form id="loginForm">
          <div class="form-group">
            <label class="form-label" for="email" data-i18n="lg.email_label">Email address</label>
            <input type="email" class="form-input" id="email" placeholder="you@company.com" data-i18n-attr="placeholder:lg.email_ph" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="password" data-i18n="lg.password_label">Password</label>
            <input type="password" class="form-input" id="password" placeholder="Enter your password" data-i18n-attr="placeholder:lg.password_ph" required>
          </div>

          <div class="form-row">
            <label class="checkbox-label">
              <input type="checkbox" id="remember" checked>
              <span class="checkbox-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
              </span>
              <span data-i18n="lg.remember">Remember me</span>
            </label>
            <a href="forgot-password.html" class="form-link" data-i18n="lg.forgot">Forgot password?</a>
          </div>

          <button type="submit" class="btn-primary" id="loginBtn">
            <span data-i18n="lg.signin">Sign in</span>
          </button>
        </form>

        <div class="auth-divider"><span data-i18n="lg.divider">or continue with</span></div>

        <!-- Provider-driven: each button is hidden until the backend reports its
             provider as configured (/auth/oauth/providers). No dead buttons. -->
        <div class="social-buttons">
          <button type="button" class="btn-social" data-provider="google" style="display:none" onclick="socialLogin('google')">
            <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            <span data-i18n="lg.continue_google">Google</span>
          </button>
          <button type="button" class="btn-social" data-provider="apple" style="display:none" onclick="socialLogin('apple')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
            <span data-i18n="lg.continue_apple">Apple</span>
          </button>
          <button type="button" class="btn-social" data-provider="microsoft" style="display:none" onclick="socialLogin('microsoft')">
            <svg viewBox="0 0 24 24"><path fill="#F25022" d="M11.4 11.4H2V2h9.4v9.4z"/><path fill="#7FBA00" d="M22 11.4h-9.4V2H22v9.4z"/><path fill="#00A4EF" d="M11.4 22H2v-9.4h9.4V22z"/><path fill="#FFB900" d="M22 22h-9.4v-9.4H22V22z"/></svg>
            <span data-i18n="lg.continue_microsoft">Microsoft</span>
          </button>
          <button type="button" class="btn-social" data-provider="linkedin" style="display:none" onclick="socialLogin('linkedin')">
            <svg viewBox="0 0 24 24" fill="#0A66C2"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.8 0 0 .78 0 1.74v20.52C0 23.22.8 24 1.77 24h20.45c.98 0 1.78-.78 1.78-1.74V1.74C24 .78 23.2 0 22.22 0z"/></svg>
            <span data-i18n="lg.continue_linkedin">LinkedIn</span>
          </button>
        </div>
      </div>

    </div>
  </main>

  <footer class="auth-footer">
    <a href="index.html" data-i18n="lg.foot_home">Home</a>
    <a href="legal.html#privacy" data-i18n="lg.foot_privacy">Privacy Policy</a>
    <a href="legal.html#terms" data-i18n="lg.foot_terms">Terms of Service</a>
    <a href="contact.html" data-i18n="lg.foot_help">Help</a>
  </footer>

  <!-- Toast -->
  <div class="toast" id="toast">
    <div class="toast-icon success">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="toast-content">
      <div class="toast-title">Success</div>
      <div class="toast-text">You have been signed in.</div>
    </div>
  </div>

      'lg.oauth_no_email':    { en: 'We need an email from ', ar: 'نحتاج إلى بريد إلكتروني من ' },
      'lg.oauth_no_email2':   { en: ' to sign you in — please allow email sharing.', ar: ' لتسجيل دخولك — يُرجى السماح بمشاركة البريد الإلكتروني.' },
      'lg.oauth_missing_params': { en: 'Sign-in didn’t complete. Please try again.', ar: 'لم يكتمل تسجيل الدخول. يُرجى المحاولة مرة أخرى.' },
      'lg.oauth_fallback':    { en: ' sign-in failed. Please try again.', ar: ' فشل تسجيل الدخول. يُرجى المحاولة مرة أخرى.' }
    });

    function showStep(step) {
      document.querySelectorAll('.auth-step').forEach(s => s.classList.remove('active'));
      document.getElementById('step-' + step).classList.add('active');
    }

    // Login form — REAL authentication against the live backend (/api/auth/login).
    // On success the backend sets the HttpOnly session cookie; we then redirect.
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;
      btn.innerHTML = '<div class="spinner"></div>';
      btn.disabled = true;

      try {
        await API.login(email, password, remember);
        showToast('success', AC_I18N.t('lg.success_title'), AC_I18N.t('lg.success_text'));
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 700);
      } catch (err) {
        const code = ((err && err.message) || '') + '';   // ApiError.message carries the backend detail string
        if (err && err.status === 403 && /EMAIL_NOT_VERIFIED/i.test(code)) {
          // account exists + password is right, but the email isn't verified yet →
          // re-send the verification link and tell them to check their inbox.
          try { await API.resendVerificationPublic(email); } catch (e) {}
          showToast('info', AC_I18N.t('lg.verify_title'), AC_I18N.t('lg.verify_text'));
        } else {
          const msg = err.status === 401 ? AC_I18N.t('lg.err_401')
                    : err.status === 429 ? AC_I18N.t('lg.err_429')
                    : err.status === 403 ? AC_I18N.t('lg.err_403')
                    : (err.message || AC_I18N.t('lg.err_generic'));
          showToast('error', AC_I18N.t('lg.err_title'), msg);
        }
        btn.innerHTML = '<span data-i18n="lg.signin">' + AC_I18N.t('lg.signin') + '</span>';
        btn.disabled = false;
      }
    });

    // 2FA UI removed — it was unreachable dead code (has2FA was always false) that
    // accepted ANY 6-digit code / any 8+-char "backup code" client-side, securing
    // nothing. Real TOTP 2FA is tracked under settings security (Phase L).

    // ── Social login (provider-driven — no dead buttons) ────────────────────
    // Every OAuth button starts hidden and is revealed ONLY for providers the
    // backend reports as configured (/auth/oauth/providers). A shown button always
    // starts a real OAuth redirect; an unconfigured provider is never shown. Add a
    // provider's env keys on the server -> its button appears automatically, with
    // no frontend change. Backend module: backend/auth/oauth/.
    function socialLogin(provider) {
      const key = (provider || '').toLowerCase();
      if (key) window.location.href = '/auth/' + key;   // real OAuth start
    }
    (function () {
      function gate() {
        var box = document.querySelector('.social-buttons');
        var divider = document.querySelector('.auth-divider');
        var btns = Array.prototype.slice.call(document.querySelectorAll('.btn-social[data-provider]'));
        function hideAll() { if (box) box.style.display = 'none'; if (divider) divider.style.display = 'none'; }
        fetch('/api/auth/oauth/providers').then(function (r) { return r.json(); }).then(function (d) {
          var prov = (d && d.providers) || {};
          var any = false;
          btns.forEach(function (b) {
            if (prov[b.getAttribute('data-provider')]) { b.style.display = ''; any = true; }
          });
          if (!any) hideAll();   // no provider configured -> drop the whole OAuth section cleanly
        }).catch(hideAll);       // on error, show nothing rather than a button that may fail
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', gate);
      else gate();
    })();

    // Surface OAuth callback errors (backend redirects back with ?oauth_error=...).
    (function showOAuthError() {
      const params = new URLSearchParams(location.search);
      const err = params.get('oauth_error');
      if (!err) return;
      const prov = params.get('provider') || 'Social';
      const cap = prov.charAt(0).toUpperCase() + prov.slice(1);
      const MSG = {
        cancelled: AC_I18N.t('lg.oauth_cancelled'),
        not_configured: cap + AC_I18N.t('lg.oauth_not_configured'),
        bad_state: AC_I18N.t('lg.oauth_bad_state'),
        exchange_failed: AC_I18N.t('lg.oauth_exchange_failed') + cap + AC_I18N.t('lg.oauth_exchange_failed2'),
        provider_unavailable: cap + AC_I18N.t('lg.oauth_provider_unavailable'),
        provider_error: cap + AC_I18N.t('lg.oauth_provider_error'),
        no_email: AC_I18N.t('lg.oauth_no_email') + cap + AC_I18N.t('lg.oauth_no_email2'),
        missing_params: AC_I18N.t('lg.oauth_missing_params')
      };
      showToast('error', cap + AC_I18N.t('lg.oauth_title'), MSG[err] || (cap + AC_I18N.t('lg.oauth_fallback')));
      history.replaceState({}, '', location.pathname);
    })();

    function showToast(type, title, text) {
      const toast = document.getElementById('toast');
      const icon = toast.querySelector('.toast-icon');
      icon.className = 'toast-icon ' + type;
      icon.innerHTML = type === 'success'
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>'
        : type === 'info'
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>';
      toast.querySelector('.toast-title').textContent = title;
      toast.querySelector('.toast-text').textContent = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 4000);
    }
  </script>
</body>
</html>
