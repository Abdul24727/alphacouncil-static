# beta.alphacouncil.tech: the rebuilt app (staging). Password-protected and not indexed.
# certbot --nginx -d beta.alphacouncil.tech adds the 443 server and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name beta.alphacouncil.tech;

    # Same logins as the old staging site (owner's choice).
    auth_basic "AlphaCouncil beta";
    auth_basic_user_file /etc/nginx/.htpasswd-staging;

    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 5m;

    # Let's Encrypt HTTP-01 challenge must not require the password.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_beta;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

map $http_upgrade $connection_upgrade_beta {
    default upgrade;
    ''      close;
}
