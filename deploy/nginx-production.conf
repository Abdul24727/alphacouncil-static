# alphacouncil.tech: the rebuilt app (production). Installed by hand (docs/production.md);
# api.alphacouncil.tech stays on the old site's server block, unchanged.
# Certificate: the existing Let's Encrypt "alphacouncil.tech" certificate.

map $http_upgrade $connection_upgrade_prod {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name alphacouncil.tech www.alphacouncil.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://alphacouncil.tech$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name alphacouncil.tech www.alphacouncil.tech;

    ssl_certificate /etc/letsencrypt/live/alphacouncil.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alphacouncil.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($host = www.alphacouncil.tech) { return 301 https://alphacouncil.tech$request_uri; }

    # The app sends its own CSP, X-Frame-Options, nosniff, Referrer- and Permissions-Policy;
    # adding them here too would send each twice, with different values. HSTS is ours.
    add_header Strict-Transport-Security "max-age=15768000" always;
    client_max_body_size 5m;

    # --- Old site addresses (static-v2) -> their pages in the new app -----------------------
    location = /index.html            { return 301 /; }
    location = /features.html         { return 301 /; }
    location = /about.html            { return 301 /; }
    location = /how-it-works.html     { return 301 /methodology; }
    location = /methodology.html      { return 301 /methodology; }
    location = /pricing.html          { return 301 /pricing; }
    location = /checkout.html         { return 301 /pricing; }
    location = /upgrade-success.html  { return 301 /pricing; }
    location = /login.html            { return 301 /login; }
    location = /forgot-password.html  { return 301 /login; }
    location = /reset-password.html   { return 301 /login; }
    location = /verify-email.html     { return 301 /login; }
    location = /signup.html           { return 301 /signup; }
    location = /onboarding.html       { return 301 /signup; }
    location = /dashboard.html        { return 301 /home; }
    location = /news.html             { return 301 /home; }
    location = /article.html          { return 301 /home; }
    location = /council-history.html  { return 301 /home; }
    location = /markets.html          { return 301 /markets; }
    location = /markets-app.html      { return 301 /markets; }
    location = /portfolio.html        { return 301 /portfolio; }
    location = /alerts.html           { return 301 /portfolio; }
    location = /settings.html         { return 301 /settings; }
    location = /scenarios.html        { return 301 /templates; }
    location = /contact.html          { return 301 /legal; }
    location = /legal.html            { return 301 /legal; }
    location ~ ^/legal/ar/([a-z-]+)/?$ { return 301 /ar/legal/$1; }
    location ~ ^/legal/([a-z-]+)\.html$ { return 301 /legal/$1; }
    location = /stock-detail.html {
        if ($arg_ticker) { return 301 /t/$arg_ticker; }
        return 301 /markets;
    }

    location / {
        # next start -H localhost binds the IPv6 loopback on this host.
        proxy_pass http://[::1]:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_prod;
        proxy_read_timeout 300s;
        # The Copilot streams its answers.
        proxy_buffering off;
    }
}
