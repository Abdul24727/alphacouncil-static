  <title>Legal — AlphaCouncil</title>
  <meta name="robots" content="noindex">
  <!-- This page is superseded by the canonical, versioned legal suite at /legal/*.
       It is kept only as a redirect so existing inbound links (legal.html#terms,
       #privacy, #refund, #disclaimer) still resolve to the authoritative documents —
       the single source of truth the acceptance system hashes against. There is no
       duplicate legal content here to drift out of sync. -->
  <script>
    (function () {
      var map = {
        '#terms': '/legal/terms',
        '#privacy': '/legal/privacy',
        '#refund': '/legal/refunds',
        '#refunds': '/legal/refunds',
        '#disclaimer': '/legal/ai-financial-disclaimer',
        '#ai-disclaimer': '/legal/ai-financial-disclaimer',
        '#cookies': '/legal/cookies'
      };
      var dest = map[(location.hash || '').toLowerCase()] || '/legal/';
      location.replace(dest);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/legal/"></noscript>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: #07111F; color: #AAB6C5;
      display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    a { color: #27D3C3; }
  </style>
</head>
